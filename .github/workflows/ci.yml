name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  checks:
    name: Contracts and Unit Tests (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Format, references, contracts, wiring, package, run and unit checks
        run: npm test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  install:
    name: Install Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Verify installation in an isolated host home
        env:
          AUTO_CLI_INSTALL_HOME: ${{ runner.temp }}/auto-cli-install
          AUTO_CLI_INSTALL_TEST_MODE: '1'
          CODEX_HOME: ${{ runner.temp }}/auto-cli-install/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/auto-cli-install/.claude
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; const root = process.env.AUTO_CLI_INSTALL_HOME; for (const name of ['.claude', '.codex']) fs.mkdirSync(path.join(root, name), { recursive: true }); fs.writeFileSync(path.join(root, '.auto-cli-install-test-root'), 'auto-cli isolated installation fixture\n');"
          node scripts/install.js
